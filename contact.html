<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me | Peter Torres</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Custom CSS File -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light text-dark d-flex flex-column min-vh-100">

    <!-- Navigation Bar (Matches index.html) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="index.html">PETER TORRES</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto gap-1">
                    <li class="nav-item"><a class="nav-link" href="index.html#about">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#gallery">Gallery</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#learning-goals">Goals</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#hobbies">Hobbies</a></li>
                    <li class="nav-item"><a class="nav-link btn btn-primary text-white ms-lg-2 px-3 mt-2 mt-lg-0 active" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main class="container my-auto py-5 d-flex justify-content-center">
        <!-- Replaced inline style with the contact-card class -->
        <section id="contact" class="card contact-card shadow-sm p-4 p-md-5 border-0 w-100">
            <div class="border-bottom pb-3 mb-4">
                <h2 class="text-primary fw-bold mb-1">Contact Me</h2>
                <p class="text-muted mb-0">Use this form to send a practice message</p>
            </div>

            <form action="#" method="POST">
                <div class="row g-3">
                    
                    <!-- Full Name -->
                    <div class="col-12 col-md-6">
                        <label for="full-name" class="form-label fw-semibold">
                            Full Name <span class="text-danger fs-7">*</span>
                        </label>
                        <input type="text" class="form-control" id="full-name" name="fullName" placeholder="Enter your full name" required>
                    </div>

                    <!-- Email -->
                    <div class="col-12 col-md-6">
                        <label for="email" class="form-label fw-semibold">
                            Email <span class="text-danger fs-7">*</span>
                        </label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
                    </div>

                    <!-- Topic Dropdown -->
                    <div class="col-12">
                        <label for="topic" class="form-label fw-semibold">Topic</label>
                        <select class="form-select" name="topic" id="topic" required>
                            <option value="">Choose a Topic</option>
                            <option value="feedback">Project Feedback</option>
                            <option value="collaboration">Collaboration</option>
                            <option value="questions">Questions</option>
                        </select>
                    </div>

                    <!-- Preferred Contact Method -->
                    <div class="col-12 col-md-6">
                        <fieldset class="border rounded p-3 h-100">
                            <legend class="float-none w-auto fs-6 fw-semibold px-2 mb-2 text-primary">Preferred Contact Method</legend>
                            
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="radio" id="method-email" name="contactMethod" value="email" checked>
                                <label class="form-check-label" for="method-email">Email</label>
                            </div>
                            
                            <div class="form-check">
                                <input class="form-check-input" type="radio" id="method-phone" name="contactMethod" value="phone">
                                <label class="form-check-label" for="method-phone">Phone</label>
                            </div>
                        </fieldset>
                    </div>

                    <!-- Interests -->
                    <div class="col-12 col-md-6">
                        <fieldset class="border rounded p-3 h-100">
                            <legend class="float-none w-auto fs-6 fw-semibold px-2 mb-2 text-primary">Interests</legend>
                            
                            <div class="form-check mb-1">
                                <input class="form-check-input" type="checkbox" id="interest-html" name="interests" value="html">
                                <label class="form-check-label" for="interest-html">HTML</label>
                            </div>
                            
                            <div class="form-check mb-1">
                                <input class="form-check-input" type="checkbox" id="interest-css" name="interests" value="css">
                                <label class="form-check-label" for="interest-css">CSS</label>
                            </div>
                            
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="interest-ai" name="interests" value="ai">
                                <label class="form-check-label" for="interest-ai">AI-assisted development</label>
                            </div>
                        </fieldset>
                    </div>

                    <!-- Message Textarea -->
                    <div class="col-12">
                        <label for="message" class="form-label fw-semibold">Message</label>
                        <textarea class="form-control" id="message" name="message" rows="5" placeholder="Write your message here..." required></textarea>
                    </div>

                    <!-- Submit Button -->
                    <div class="col-12 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg w-100 shadow-sm">Send Message</button>
                    </div>

                </div>
            </form>
        </section>
    </main>

    <!-- Footer Section -->
    <footer class="bg-dark text-white text-center py-4 mt-auto">
        <div class="container">
            <p class="mb-0 text-secondary">&copy; 2026 PETER TORRES. All rights reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
