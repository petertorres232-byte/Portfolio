<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
    <style>
        /* Modern UI Form Styling */
        :root {
            --bg-color: #f8fafc;
            --card-color: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --border: #cbd5e1;
            --radius: 8px;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        *, *::before, *::after {
            box-sizing: inherit;
        }

        #contact {
            background-color: var(--card-color);
            padding: 40px;
            border-radius: var(--radius);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 550px;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 6px;
            font-size: 1.8rem;
            color: var(--text-main);
        }

        #contact > p {
            color: var(--text-muted);
            margin-bottom: 28px;
            margin-top: 0;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-main);
        }

        /* Styling the (Required) tag */
        label span {
            color: #dc2626;
            font-size: 0.8rem;
            font-weight: normal;
            margin-left: 4px;
        }

        input[type="text"],
        input[type="email"],
        select,
        textarea {
            width: 100%;
            padding: 10px 14px;
            background-color: #ffffff;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text-main);
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        fieldset {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        legend {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-muted);
            padding: 0 6px;
        }

        .option-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: normal;
            cursor: pointer;
        }

        .option-group input {
            margin: 0;
            cursor: pointer;
            width: 16px;
            height: 16px;
        }

        textarea {
            resize: vertical;
            min-height: 110px;
        }

        button[type="submit"] {
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: var(--radius);
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 5px;
        }

        button[type="submit"]:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>

    <section id="contact">
        <h2>Contact Me</h2>
        <p>Use this form to send a practice message</p>

        <form action="#" method="POST">
            
            <div class="form-group">
                <label for="full-name">Full Name<span>(Required)</span></label>
                <input type="text" id="full-name" name="fullName" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="email">Email<span>(Required)</span></label>
                <input type="email" id="email" name="email" placeholder="name@example.com" required>
            </div>

            <div class="form-group">
                <label for="topic">Topic</label>
                <select name="topic" id="topic" required>
                    <option value="">Choose a Topic</option>
                    <option value="feedback">Project Feedback</option>
                    <option value="collaboration">Collaboration</option>
                    <option value="questions">Questions</option>
                </select>
            </div>

            <fieldset>
                <legend>Preferred contact method</legend>
                
                <label class="option-group" for="method-email">
                    <input type="radio" id="method-email" name="contactMethod" value="email" checked>
                    Email
                </label>

                <label class="option-group" for="method-phone">
                    <input type="radio" id="method-phone" name="contactMethod" value="phone">
                    Phone
                </label>
            </fieldset>

            <fieldset>
                <legend>Interests</legend>

                <label class="option-group" for="interest-html">
                    <input type="checkbox" id="interest-html" name="interests" value="html">
                    HTML
                </label>

                <label class="option-group" for="interest-css">
                    <input type="checkbox" id="interest-css" name="interests" value="css">
                    CSS
                </label>

                <label class="option-group" for="interest-ai">
                    <input type="checkbox" id="interest-ai" name="interests" value="ai">
                    AI-assisted development
                </label>
            </fieldset>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" placeholder="Write your message here..." required></textarea>
            </div>

            <button type="submit">Send Message</button>
        </form>
    </section>

</body>
</html>
